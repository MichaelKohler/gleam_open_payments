name = "open_payments"
version = "0.1.0"

description = "Open Payments SDK for Gleam"
licences = ["Apache-2.0"]
repository = { type = "github", user = "MichaelKohler", repo = "gleam_open_payments" }
links = [{ title = "Website", href = "https://openpayments.dev" }]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
http_digest_fields = ">= 1.0.0 and < 2.0.0"
generic_http_message_signatures = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.10.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
